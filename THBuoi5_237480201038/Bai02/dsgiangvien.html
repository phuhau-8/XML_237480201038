<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách giảng viên</title>

    <style>
        table {
            border-collapse: collapse;
            width: 800px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            text-align: center;
            background-color: #eee;
        }
    </style>
</head>

<body>

<h2>DANH SÁCH GIẢNG VIÊN</h2>

<table>
    <thead>
        <tr>
            <th>STT</th>
            <th>Họ tên giảng viên</th>
            <th>Ngành</th>
            <th>Đơn vị</th>
        </tr>
    </thead>

    <tbody id="dsGiangVien">
    </tbody>
</table>

<script>
    fetch("hosogiangvien.xml")
        .then(response => response.text())
        .then(data => {

            let parser = new DOMParser();
            let xml = parser.parseFromString(data, "text/xml");

            let giangviens = xml.getElementsByTagName("giangvien");

            let tbody = document.getElementById("dsGiangVien");

            for (let i = 0; i < giangviens.length; i++) {

                let hoten = giangviens[i]
                    .getElementsByTagName("hoten")[0]
                    .textContent;

                let nganh = giangviens[i]
                    .getElementsByTagName("nganh")[0]
                    .textContent;

                let donvi = giangviens[i]
                    .getElementsByTagName("donvi")[0]
                    .textContent;

                let row = `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${hoten}</td>
                        <td>${nganh}</td>
                        <td>${donvi}</td>
                    </tr>
                `;

                tbody.innerHTML += row;
            }
        })
        .catch(error => {
            console.log("Lỗi:", error);
        });
</script>

</body>
</html>
