<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Môn học - Minh Khai</title>

    <style>
        table {
            border-collapse: collapse;
            width: 700px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            text-align: center;
            background-color: #eee;
        }
    </style>
</head>

<body>

<h2>CÁC MÔN HỌC CÓ NHÀ XUẤT BẢN "MINH KHAI"</h2>

<table>
    <thead>
        <tr>
            <th>STT</th>
            <th>Tên môn học</th>
            <th>Nhà xuất bản</th>
            <th>Tác giả</th>
        </tr>
    </thead>

    <tbody id="dsMonHoc">
    </tbody>
</table>

<script>
    fetch("dsmonhoc.xml")
        .then(response => response.text())
        .then(data => {

            let parser = new DOMParser();
            let xml = parser.parseFromString(data, "text/xml");

            let subjects = xml.getElementsByTagName("subject");

            let tbody = document.getElementById("dsMonHoc");

            let stt = 1;

            for (let i = 0; i < subjects.length; i++) {

                let title = subjects[i]
                    .getElementsByTagName("title")[0]
                    .textContent;

                let publisher = subjects[i]
                    .getElementsByTagName("publisher")[0]
                    .textContent;

                let author = subjects[i]
                    .getElementsByTagName("author")[0]
                    .textContent;

                // Chỉ lấy môn có NXB Minh Khai
                if (publisher.trim() === "Minh Khai") {

                    let row = `
                        <tr>
                            <td>${stt}</td>
                            <td>${title}</td>
                            <td>${publisher}</td>
                            <td>${author}</td>
                        </tr>
                    `;

                    tbody.innerHTML += row;

                    stt++;
                }
            }
        })
        .catch(error => {
            console.log("Lỗi:", error);
        });
</script>

</body>
</html>
